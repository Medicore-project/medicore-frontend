# =============================================================================
# azure-static-web-apps.yml — MediCore Frontend CI/CD
# =============================================================================
# Builds the React + Vite app and deploys to Azure Static Web Apps.
#
# Secrets required (add in GitHub repo Settings → Secrets → Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — deploy token from Azure Portal
#   VITE_API_BASE_URL                — backend API URL
# =============================================================================

name: Deploy Frontend — Azure Static Web Apps

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20.x"

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React app (Vite)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
          skip_app_build: true
